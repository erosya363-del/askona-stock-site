<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" id="themeColor" />
    <meta name="author" content="Ярослав Федоренко" />
    <meta name="copyright" content="© 2026 Ярослав Федоренко" />
    <meta name="application-name" content="Остатки" />
    <meta name="apple-mobile-web-app-title" content="Остатки" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <title>Остатки Обухово · Askona</title>
    <script>
      (function () {
        var KEY = "askona-stock-theme";
        var pref = localStorage.getItem(KEY);
        if (pref !== "light" && pref !== "dark") pref = "system";
        var dark =
          pref === "dark" ||
          (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.add(dark ? "dark" : "light");
        root.dataset.theme = pref;
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.getElementById("themeColor");
        if (meta) meta.setAttribute("content", dark ? "#121214" : "#f8fafc");
      })();
    </script>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--boot-bg, #121214) 72%, transparent);
        -webkit-backdrop-filter: blur(22px) saturate(1.15);
        backdrop-filter: blur(22px) saturate(1.15);
        transition: opacity 0.42s cubic-bezier(0.22, 0.61, 0.36, 1),
          visibility 0.42s step-end;
      }
      html.light .boot {
        --boot-bg: #f8fafc;
        --boot-glass: rgba(255, 255, 255, 0.55);
        --boot-line: rgba(15, 23, 42, 0.08);
        --boot-ink: #1a202c;
        --boot-muted: #718096;
      }
      html.dark .boot {
        --boot-bg: #121214;
        --boot-glass: rgba(22, 22, 24, 0.52);
        --boot-line: rgba(255, 255, 255, 0.08);
        --boot-ink: #f2f2f3;
        --boot-muted: #a1a1aa;
      }
      .boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.42s cubic-bezier(0.22, 0.61, 0.36, 1),
          visibility 0s linear 0.42s;
      }
      .boot__glass {
        width: min(100%, 280px);
        padding: 28px 24px 24px;
        border-radius: 24px;
        border: 1px solid var(--boot-line);
        background: var(--boot-glass);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
        text-align: center;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }
      .boot__logo {
        display: block;
        width: 132px;
        height: 34px;
        margin: 0 auto 14px;
        background: #11b5b0;
        -webkit-mask: url("assets/logo-askona.png?v=3") left center / contain no-repeat;
        mask: url("assets/logo-askona.png?v=3") left center / contain no-repeat;
      }
      .boot__title {
        margin: 0;
        font-family: "Unbounded", system-ui, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--boot-ink);
      }
      .boot__sub {
        margin: 4px 0 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--boot-muted);
      }
      .boot__bar {
        margin: 22px auto 0;
        width: 96px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in srgb, var(--boot-muted) 28%, transparent);
      }
      .boot__bar > span {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: #11b5b0;
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      .boot__status {
        margin: 12px 0 0;
        font-size: 12px;
        font-weight: 500;
        color: var(--boot-muted);
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar > span { animation: none; width: 100%; opacity: 0.7; }
        .boot { transition: none; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css?v=13" />
  </head>
  <body>
    <div class="boot" id="bootSplash" role="status" aria-live="polite" aria-busy="true">
      <div class="boot__glass">
        <span class="boot__logo" aria-hidden="true"></span>
        <p class="boot__title">Остатки</p>
        <p class="boot__sub">Обухово</p>
        <div class="boot__bar" aria-hidden="true"><span></span></div>
        <p class="boot__status" id="bootStatus">Открываем каталог…</p>
      </div>
    </div>

    <div class="ambient" aria-hidden="true">
      <span class="ambient-dots"></span>
      <span class="ambient-glow ambient-glow-a"></span>
      <span class="ambient-glow ambient-glow-b"></span>
    </div>

    <header class="top">
      <div class="top__row">
        <div class="brand-wrap">
          <a class="brand" href="./" aria-label="Askona — остатки Обухово">
            <span class="brand__logo" role="img" aria-hidden="true"></span>
            <span class="brand__copy">
              <span class="brand__title">Остатки</span>
              <span class="brand__sub">Обухово</span>
            </span>
          </a>
          <p class="live" id="liveLine" role="status">
            <span class="live__pill" id="livePill">
              <span class="live__dot" aria-hidden="true"></span>
              <span id="liveLabel">…</span>
            </span>
            <span class="live__text" id="liveText">Загрузка статуса…</span>
          </p>
        </div>
        <div class="top__tools">
          <div class="theme-switch" role="radiogroup" aria-label="Тема оформления">
            <button
              type="button"
              data-theme-pref="system"
              aria-pressed="true"
              title="Как в системе"
            >
              <span class="visually-hidden">Как в системе</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="12" rx="2" />
                <path d="M8 19.5h8M12 16.5v3" stroke-linecap="round" />
              </svg>
            </button>
            <button type="button" data-theme-pref="light" aria-pressed="false" title="Светлая">
              <span class="visually-hidden">Светлая</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="3.6" />
                <path
                  d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M6.1 17.9l1.6-1.6M16.3 7.7l1.6-1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button type="button" data-theme-pref="dark" aria-pressed="false" title="Тёмная">
              <span class="visually-hidden">Тёмная</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path
                  d="M20 13.4A7.6 7.6 0 0 1 10.6 4 7.2 7.2 0 1 0 20 13.4z"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="search" id="searchBox">
        <label class="search__field" for="q">
          <span class="visually-hidden">Найти товар</span>
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="11" cy="11" r="6.2" />
            <path d="M16 16.5 20 20.5" stroke-linecap="round" />
          </svg>
          <input
            id="q"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            spellcheck="false"
            placeholder=""
            aria-autocomplete="list"
            aria-controls="searchSuggest"
            aria-expanded="false"
          />
          <span class="search__hint" id="searchHint" aria-hidden="true"></span>
        </label>
        <div class="search__drop" id="searchDrop" hidden>
          <p class="search__drop-title" id="searchDropTitle">Популярные запросы</p>
          <ul class="search__suggest" id="searchSuggest" role="listbox"></ul>
        </div>
      </div>
      <div class="top__actions">
        <button class="btn btn--sale" id="saleBtn" type="button" aria-pressed="false">Распродажа</button>
        <button class="btn btn--filter" id="filtersBtn" type="button" aria-pressed="false">Фильтры</button>
        <button class="btn btn--reset" id="resetBtn" type="button" title="Сбросить всё" aria-label="Сбросить всё">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M7 7l10 10M17 7 7 17" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="cats" id="catsRail">
        <button class="cats__nav cats__nav--prev" id="catsPrev" type="button" aria-label="Предыдущие категории" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="cats__track" id="desktopChips" aria-label="Категории"></div>
        <button class="cats__nav cats__nav--next" id="catsNext" type="button" aria-label="Ещё категории" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9.5 6 15.5 12l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <p class="meta" id="metaLine">Загрузка…</p>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Ничего не найдено. Попробуйте «чехол» или «200*160».</p>
      <div id="sentinel" aria-hidden="true"></div>
      <p class="credit" id="siteCredit">© 2026 Ярослав Федоренко · v1.0.11</p>
    </main>

    <div class="sheet" id="sheet" hidden>
      <button class="sheet__backdrop" id="sheetBackdrop" type="button" aria-label="Закрыть"></button>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet__grab"></div>
        <div class="sheet__head">
          <h2 id="sheetTitle">Фильтры</h2>
          <button class="btn btn--ghost" id="sheetClose" type="button">Готово</button>
        </div>
        <div class="sheet__body" id="sheetBody"></div>
      </div>
    </div>

    <script src="assets/app.js?v=13"></script>
  </body>
</html>
